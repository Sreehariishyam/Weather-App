<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72, #2a9df4, #7fd6ff);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .weather-card {
      max-width: 380px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    .search-btn {
      color: #1e3c72;
      transition: transform 0.2s;
    }

    .search-btn:hover {
      transform: scale(1.07);
    }

    .temp {
      font-size: 60px;
    }

    .details-box {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 16px;
    }

    .error-box {
      background: rgba(255, 80, 80, 0.35);
      border-radius: 12px;
    }
  </style>
</head>

<body class="d-flex justify-content-center align-items-center p-3">

  <div class="weather-card w-100 text-center text-white px-4 py-5">

    <h1 class="fs-3 mb-4">🌤️ Weather App</h1>


    <div class="d-flex gap-2">
      <input type="text" id="place" class="form-control rounded-pill border-0 px-4 py-2"
             placeholder="Enter place name">
      <button class="btn btn-light search-btn rounded-pill fw-bold px-4" onclick="getWeather()"> Search </button>
    </div>

    <div id="result" class="mt-4"></div>
  </div>

  <script>
    
    var input = document.getElementById("place");
    var result = document.getElementById("result");

    // Press Enter to search
    input.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        getWeather();
      }
    });

    function getWeather() {
     
      var place = input.value.trim();

      if (place === "") {
        result.innerHTML = "<p class='error-box fs-5 p-3 mb-0'>Please enter a place name</p>";
        return;
      }

      result.innerHTML = "<p>Loading...</p>";

      var url = "https://api.openweathermap.org/data/2.5/weather?q=" + place + "&appid=8ac5c4d57ba6a4b3dfcf622700447b1e&units=metric";

      fetch(url)
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          if (data.cod == 200) {
            var icon = data.weather[0].icon;

            result.innerHTML =
              "<img src='https://openweathermap.org/img/wn/" + icon + "@2x.png' width='110'>" +
              "<div class='fs-2 fw-semibold'>" + data.name + ", " + data.sys.country + "</div>" +
              "<div class='temp fw-bold my-1'>" + Math.round(data.main.temp) + "°C</div>" +
              "<div class='fs-5 text-capitalize mb-4'>" + data.weather[0].description + "</div>" +
              "<div class='details-box row g-0 p-3'>" +
                "<div class='col-4'><small>Humidity</small><div class='fs-5 fw-bold'>" + data.main.humidity + "%</div></div>" +
                "<div class='col-4'><small>Wind</small><div class='fs-5 fw-bold'>" + data.wind.speed + " m/s</div></div>" +
                "<div class='col-4'><small>Feels like</small><div class='fs-5 fw-bold'>" + Math.round(data.main.feels_like) + "°C</div></div>" +
              "</div>";
          } else {
            result.innerHTML = "<p class='error-box fs-5 p-3 mb-0'>Place not found 😕</p>";
          }
        })
        .catch(function (error) {
          result.innerHTML = "<p class='error-box fs-5 p-3 mb-0'>Something went wrong.</p>";
        });
    }
  </script>
</body>
</html>
